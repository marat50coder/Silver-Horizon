workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Silver Horizon Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.silverhorizon.horizongame
        NSE_BUNDLE_ID: com.silverhorizon.horizongame.NotificationService
        APP_STORE_APPLE_ID: "6817293412"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-gray-part
          include: true

    scripts:
      - name: Restore GoogleService-Info.plist
        script: |
          set -e
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST env var is empty — add it as a secure variable in Codemagic."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          plutil -lint "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          app-store-connect fetch-signing-files "$NSE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
