name: horizongame
description: "Silver Horizon — portrait iOS slot with wilds, scatter bonus wheel, free spins, daily rewards and achievements."
publish_to: 'none'

version: 1.0.1+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2
  connectivity_plus: '>=7.0.0 <7.1.0'
  http: ^1.6.0
  device_info_plus: 12.3.0
  flutter_secure_storage: ^10.3.1
  webview_flutter_wkwebview: ^3.26.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/Silver_Horizon_additional_assets/
    - assets/Silver_Horizon_gameplay_assets/

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/Silver_Horizon_additional_assets/Icon.png"
  remove_alpha_ios: true
